<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin • Simple</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1022; color: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; border-bottom: 1px solid #1f2937; background: #0f172a; }
    main { flex: 1; display: grid; grid-template-columns: 200px 1fr 280px; transition: grid-template-columns 0.2s ease; }
    .collapsed-left main { grid-template-columns: 0 1fr 280px; }
    .collapsed-left #sidebar { display: none; }
    .collapsed-right main { grid-template-columns: 200px 1fr 0; }
    .collapsed-right #rightPanel { display: none; }
    .collapsed-left.collapsed-right main { grid-template-columns: 0 1fr 0; }
    #sidebar { border-right: 1px solid #1f2937; padding: 10px; }
    #watch { display: flex; flex-direction: column; gap: 6px; }
    .watch-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid #374151; border-radius: 8px; cursor: pointer; }
    .watch-item .rm { margin-left: 10px; color: #fca5a5; cursor: pointer; }
    #chart { width: 100%; height: calc(100vh - 54px); }
    #rightPanel { border-left: 1px solid #1f2937; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .panel-title { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }
    .level-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
    .level-left { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .swatch-grey { background: #94a3b8; }
    .swatch-blue { background: #38bdf8; }
    #msg { padding: 6px 12px; color: #fca5a5; font-size: 13px; }
    #topbar { display:flex; gap:10px; align-items:center; }
    #search { width: 320px; padding: 8px 10px; border-radius: 8px; border: 1px solid #374151; background: #0a0f20; color: #e5e7eb; }
    #go, .tf, #add, #toggleLeft, #toggleRight { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #0a0f20; color: #e5e7eb; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div id="topbar">
        <div id="title">AAPL • 15m</div>
        <input id="search" list="symbols" placeholder="Search ticker (AAPL, TSLA, apple)" />
        <datalist id="symbols"></datalist>
        <button id="go">Go</button>
        <button id="toggleLeft" title="Toggle watchlist">⟷ Watch</button>
        <button id="toggleRight" title="Toggle side panel">⟷ Panel</button>
        <div style="margin-left:auto; display:flex; gap:6px;">
          <button class="tf" data-tf="1m">1m</button>
          <button class="tf" data-tf="5m">5m</button>
          <button class="tf" data-tf="15m">15m</button>
          <button class="tf" data-tf="1h">1h</button>
          <button class="tf" data-tf="day">1d</button>
          <button class="tf" data-tf="month">1mo</button>
          <button id="add">+ Add</button>
        </div>
      </div>
    </header>
    <div id="msg"></div>
    <main>
      <aside id="sidebar">
        <div class="small" style="color:#94a3b8;margin-bottom:6px;">Watchlist</div>
        <div id="watch"></div>
      </aside>
      <div id="chart"></div>
      <aside id="rightPanel">
        <div class="panel-title">Levels</div>
        <div id="levelsBox" style="border: 1px solid #374151; border-radius: 8px; padding: 10px; background: #0a0f20;">
          <div class="level-row"><div class="level-left"><span class="swatch swatch-grey"></span><span>L.M.L</span></div><div id="live_lvl_lml">—</div></div>
          <div class="level-row"><div class="level-left"><span class="swatch swatch-grey"></span><span>L.M.H</span></div><div id="live_lvl_lmh">—</div></div>
          <div class="level-row"><div class="level-left"><span class="swatch swatch-blue"></span><span>P.P.M.L</span></div><div id="live_lvl_ppml">—</div></div>
          <div class="level-row"><div class="level-left"><span class="swatch swatch-blue"></span><span>P.P.M.H</span></div><div id="live_lvl_ppmh">—</div></div>
        </div>
      </aside>
    </main>
  </div>
  <script>
    // Basic chart init
    let chartApi, candleSeries;
    // Determine API base: use ?api=... when provided, else default to same-origin /api
    const API_BASE = (() => {
      try {
        const sp = new URLSearchParams(window.location.search);
        const base = sp.get('api');
        if (base) return base.replace(/\/+$/, '');
      } catch (e) {}
      return '/api';
    })();

    async function ensureChart() {
      if (chartApi && candleSeries) return;
      chartApi = window.LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { background: { color: '#0b1022' }, textColor: '#e5e7eb' },
        rightPriceScale: { borderColor: '#1f2937' },
        timeScale: { borderColor: '#1f2937', timeVisible: true, secondsVisible: false },
        grid: { vertLines: { color: '#111827' }, horzLines: { color: '#111827' } }
      });
      candleSeries = chartApi.addCandlestickSeries({ upColor: '#0ec07f', downColor: '#ff4d4f', borderDownColor: '#ff4d4f', borderUpColor: '#0ec07f', wickDownColor: '#ff4d4f', wickUpColor: '#0ec07f' });
      window.chartApi = chartApi;
    }

    async function fetchCandles(symbol, timespan, windowStr) {
      const url = `${API_BASE}/candles?symbol=${encodeURIComponent(symbol)}&timespan=${timespan}&window=${windowStr}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(await resp.text());
      const data = await resp.json();
      return (data.candles || []).map(c => ({ time: Math.floor(c.t/1000), open: c.o, high: c.h, low: c.l, close: c.c, t: c.t }));
    }

    async function searchSymbols(q) {
      if (!q || q.length < 1) return [];
      try {
        const resp = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
        if (!resp.ok) return [];
        const data = await resp.json();
        return data.items || [];
      } catch { return []; }
    }

    const state = {
      symbol: 'AAPL',
      timespan: '15m',
      window: 'max',
      watch: JSON.parse(localStorage.getItem('simple.watch') || '[]'),
      priceLines: []
    };

    function saveWatch() { localStorage.setItem('simple.watch', JSON.stringify(state.watch)); }

    function clearPriceLines() {
      (state.priceLines || []).forEach(pl => { try { candleSeries.removePriceLine(pl); } catch {} });
      state.priceLines = [];
    }

    function drawLevelLines(levels) {
      clearPriceLines();
      if (!levels) return;
      const defs = [];
      if (levels.lml != null) defs.push({ price: levels.lml, color: '#94a3b8', style: 1, title: 'L.M.L' });
      if (levels.lmh != null) defs.push({ price: levels.lmh, color: '#94a3b8', style: 1, title: 'L.M.H' });
      if (levels.ppml != null) defs.push({ price: levels.ppml, color: '#38bdf8', style: 2, title: 'P.P.M.L' });
      if (levels.ppmh != null) defs.push({ price: levels.ppmh, color: '#38bdf8', style: 2, title: 'P.P.M.H' });
      const epsilon = 1e-6; const added = [];
      defs.forEach(d => {
        if (added.some(p => Math.abs(p - d.price) < epsilon)) return;
        const pl = candleSeries.createPriceLine({ price: d.price, color: d.color, lineWidth: 1, lineStyle: d.style, axisLabelVisible: true, title: d.title });
        state.priceLines.push(pl); added.push(d.price);
      });
    }

    function computeLevelsFromDaily(daily) {
      if (!daily || !daily.length) return null;
      const sorted = daily.slice().sort((a,b)=>a.t-b.t);
      const lastTs = sorted[sorted.length - 1].t;
      const lmEnd = lastTs - 24*3600*1000;
      const lmStart = lmEnd - 31*24*3600*1000;
      const lmWin = sorted.filter(c => c.t >= lmStart && c.t <= lmEnd);
      const lml = lmWin.length ? Math.min(...lmWin.map(c => c.l)) : null;
      const lmh = lmWin.length ? Math.max(...lmWin.map(c => c.h)) : null;
      const d = new Date(lastTs);
      let pmY = d.getUTCFullYear(); let pmM = d.getUTCMonth() - 1; if (pmM < 0) { pmM = 11; pmY -= 1; }
      const ppmStart = Date.UTC(pmY, pmM, 1, 0, 0, 0);
      const ppmEnd = Date.UTC(pmY, pmM + 1, 0, 23, 59, 59);
      const ppmWin = sorted.filter(c => c.t >= ppmStart && c.t <= ppmEnd);
      const ppml = ppmWin.length ? Math.min(...ppmWin.map(c => c.l)) : null;
      const ppmh = ppmWin.length ? Math.max(...ppmWin.map(c => c.h)) : null;
      return { lml, lmh, ppml, ppmh };
    }

    function renderLevelsPanel(lv) {
      const fmt = (v) => (v != null ? Number(v).toFixed(2) : '—');
      document.getElementById('live_lvl_lml').textContent = fmt(lv?.lml);
      document.getElementById('live_lvl_lmh').textContent = fmt(lv?.lmh);
      document.getElementById('live_lvl_ppml').textContent = fmt(lv?.ppml);
      document.getElementById('live_lvl_ppmh').textContent = fmt(lv?.ppmh);
    }

    async function refreshLevels(symbol) {
      try {
        const url = `${API_BASE}/candles?symbol=${encodeURIComponent(symbol)}&timespan=day&window=90d`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data?.detail || 'Daily fetch failed');
        const daily = (data.candles || []).map(c => ({ t: c.t, h: c.h, l: c.l }));
        const lv = computeLevelsFromDaily(daily);
        renderLevelsPanel(lv);
        drawLevelLines(lv);
      } catch (e) {
        // leave existing levels
      }
    }

    async function loadSymbol(symbol) {
      const sym = String(symbol || '').toUpperCase(); if (!sym) return;
      const rows = await fetchCandles(sym, state.timespan, state.window);
      candleSeries.setData(rows);
      state.symbol = sym;
      document.getElementById('title').textContent = `${state.symbol} • ${state.timespan}`;
      await refreshLevels(state.symbol);
    }

    function renderWatch() {
      const el = document.getElementById('watch');
      el.innerHTML = '';
      (state.watch || []).forEach(sym => {
        const row = document.createElement('div'); row.className = 'watch-item';
        const name = document.createElement('span'); name.textContent = sym;
        const rm = document.createElement('span'); rm.className = 'rm'; rm.textContent = '×';
        rm.onclick = (ev) => { ev.stopPropagation(); state.watch = state.watch.filter(s => s !== sym); saveWatch(); renderWatch(); };
        row.onclick = () => loadSymbol(sym);
        row.appendChild(name); row.appendChild(rm);
        el.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await ensureChart();
      // Initialize watch list
      if (!state.watch.length) { state.watch = ['AAPL', 'TSLA']; saveWatch(); }
      renderWatch();
      await loadSymbol(state.watch[0] || state.symbol);
      // Toggle handlers
      const resizeChart = () => { try { const el = document.getElementById('chart'); chartApi.applyOptions({ width: el.clientWidth, height: el.clientHeight }); } catch {} };
      document.getElementById('toggleLeft').onclick = () => { document.body.classList.toggle('collapsed-left'); setTimeout(resizeChart, 50); };
      document.getElementById('toggleRight').onclick = () => { document.body.classList.toggle('collapsed-right'); setTimeout(resizeChart, 50); };
      window.addEventListener('resize', resizeChart);

      // Timeframe switching
      document.querySelectorAll('.tf').forEach(btn => {
        btn.addEventListener('click', async () => {
          state.timespan = btn.getAttribute('data-tf');
          await loadSymbol(state.symbol);
        });
      });

      // Search suggestions into datalist
      const searchEl = document.getElementById('search');
      const dl = document.getElementById('symbols');
      searchEl.addEventListener('input', async () => {
        const q = searchEl.value.trim(); if (!q) { dl.innerHTML=''; return; }
        const items = await searchSymbols(q);
        dl.innerHTML = '';
        items.slice(0,10).forEach(it => {
          const opt = document.createElement('option');
          opt.value = it.symbol;
          opt.label = it.name || it.symbol;
          dl.appendChild(opt);
        });
      });
      // Go button
      document.getElementById('go').onclick = async () => {
        let q = searchEl.value.trim(); if (!q) return;
        let sym = q.toUpperCase();
        if (!/^[A-Z.\-]+$/.test(sym)) {
          const items = await searchSymbols(q);
          if (items.length) sym = String(items[0].symbol || '').toUpperCase();
        }
        await loadSymbol(sym);
      };
      // Add button with search-backed resolution
      document.getElementById('add').onclick = async () => {
        let q = searchEl.value.trim(); if (!q) return;
        let sym = q.toUpperCase();
        if (!/^[A-Z.\-]+$/.test(sym)) {
          const items = await searchSymbols(q);
          if (items.length) sym = String(items[0].symbol || '').toUpperCase();
        }
        if (!state.watch.includes(sym)) { state.watch.push(sym); saveWatch(); renderWatch(); }
        await loadSymbol(sym);
      };
    });
  </script>
</body>
</html>
