  <style>

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
    .input { padding: 6px 8px; border-radius: 6px; border: 1px solid #374151; background: #0a0f20; color: #e5e7eb; }

<body>
  <div id="wrap">
    <header>
      <div id="topbar">
        <div id="title">AAPL • 15m</div>
        <input id="search" list="symbols" placeholder="Search ticker (AAPL, TSLA, apple)" />
        <datalist id="symbols"></datalist>
        <button id="go">Go</button>
        <div style="margin-left:auto; display:flex; gap:6px;">

    <main>
      <aside id="sidebar">

        <div id="watch"></div>
      </aside>
      <div id="chart"></div>
      <!-- New right-side panel with tabs: keeps chart centered and is extensible -->
      <aside id="rightPanel">

          <!-- Monthly tab: label removed per requirement (kept as icon-only for space) -->

          <div id="levelsPanel" class="tab-panel" data-tab="monthly" style="display:none;">

              <span class="level-label">L.M.L:</span>

  <script>
  (() => {
    'use strict';

    // -------- API base resolver (scoped, no globals) --------
    const params = new URLSearchParams(location.search);
    const apiOverride = params.get('api');
    const cfgApi = (window.__CONFIG__ && window.__CONFIG__.API_BASE_URL) || '';
    const API_BASE_URL = (apiOverride && apiOverride.trim()) || (cfgApi && cfgApi.trim()) || '/api';

    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    const title = $('title');
    const search = $('search');
    const dl = $('symbols');
    const goBtn = $('go');
    const addBtn = $('add');
    const watchEl = $('watch');

    const state = {
      symbol: 'AAPL',
      timespan: '15m',
      window: 'max',
      chart: null,
      series: null,
      watch: JSON.parse(localStorage.getItem('simple.watch') || '[]'),
      monthlyLevels: null,
      levelLines: []
    };

    function apiUrl(endpoint, query) {
      const base = API_BASE_URL.replace(/\/+$/, '');
      const path = String(endpoint || '').replace(/^\/+/, '');
      let url = `${base}/${path}`;
      if (query) url += (query[0] === '?' ? query : `?${query}`);
      return url;
    }

    function showError(text) { msg.textContent = text || ''; }

    async function ensureChart() {
      if (state.chart && state.series) return;
      if (!window.LightweightCharts || typeof window.LightweightCharts.createChart !== 'function') {
        throw new Error('Chart library failed to load.');
      }
      state.chart = window.LightweightCharts.createChart($('chart'), {
        layout: { background: { color: '#0b1022' }, textColor: '#e5e7eb' },
        rightPriceScale: { borderColor: '#1f2937' },
        timeScale: { borderColor: '#1f2937', timeVisible: true, secondsVisible: false },
        grid: { vertLines: { color: '#111827' }, horzLines: { color: '#111827' } }
      });
      state.series = state.chart.addCandlestickSeries({
        upColor: '#0ec07f', downColor: '#ff4d4f', borderDownColor: '#ff4d4f', borderUpColor: '#0ec07f', wickDownColor: '#ff4d4f', wickUpColor: '#0ec07f'
      });
    }

    async function fetchCandles(symbol) {
      const url = apiUrl('candles', `symbol=${encodeURIComponent(symbol)}&timespan=${state.timespan}&window=${state.window}`);
      const resp = await fetch(url);
      if (!resp.ok) {
        const txt = await resp.text().catch(()=>'');
        if (txt.includes('429') || txt.includes('Too Many Requests')) {
          console.log('🚨 Rate limited (429), retrying in 3 seconds...');
          await new Promise(resolve => setTimeout(resolve, 3000));
          return await fetchCandles(symbol); // Retry once
        }
        throw new Error('Failed to get candles: ' + txt);
      }
      const data = await resp.json();
      return (data.candles || []).map(c => ({
        time: Math.floor(c.t / 1000), open: c.o, high: c.h, low: c.l, close: c.c, t: c.t
      }));
    }

    // Compute monthly levels from existing candlestick data (FIRST FUNCTION)
    function computeMonthlyLevelsFromCandles(candles) {
      console.log('🔍 DEBUG: computeMonthlyLevelsFromCandles called with:', candles.length, 'candles');
      console.log('🔍 DEBUG: First few candles:', candles.slice(0, 3));
      console.log('🔍 DEBUG: Last few candles:', candles.slice(-3));
      
      if (!candles || candles.length === 0) return null;
      
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Group candles by month based on their timestamp
      const monthlyGroups = {};
      candles.forEach(candle => {
        const date = new Date(candle.time * 1000); // Convert back to milliseconds
        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
        
        if (!monthlyGroups[monthKey]) {
          monthlyGroups[monthKey] = [];
        }
        monthlyGroups[monthKey].push(candle);
      });
      
      // Find last month data (FIRST FUNCTION)
      const lastMonthKey = `${lastMonth.getFullYear()}-${lastMonth.getMonth()}`;
      const prevMonthKey = `${prevMonth.getFullYear()}-${prevMonth.getMonth()}`;
      
      console.log('🔍 DEBUG: Month keys being searched:', { lastMonthKey, prevMonthKey });
      console.log('🔍 DEBUG: Available month keys:', Object.keys(monthlyGroups));
      
      const lastMonthCandles = monthlyGroups[lastMonthKey] || [];
      const prevMonthCandles = monthlyGroups[prevMonthKey] || [];
      
      console.log('🔍 DEBUG: Candles found for months:', {
        lastMonth: lastMonthCandles.length,
        prevMonth: prevMonthCandles.length
      });
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        console.log('🔍 DEBUG: Not enough data for both months, trying alternative approach...');
        
        // For short timeframes, try to get more data or use available data
        if (candles.length > 0) {
          // Use the highest and lowest from all available data as fallback
          const allHigh = Math.max(...candles.map(c => c.high));
          const allLow = Math.min(...candles.map(c => c.low));
          const midPrice = (allHigh + allLow) / 2;
          
          console.log('🔍 DEBUG: Using fallback levels from available data');
          return {
            lml: allLow,
            lmh: allHigh,
            ppml: midPrice * 0.98, // Slightly below mid
            ppmh: midPrice * 1.02  // Slightly above mid
          };
        }
        
        return null;
      }
      
      // Compute levels
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      const result = {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
      
      console.log('🔍 DEBUG: Computed levels result:', {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      });
      return result;
    }

    function computeMonthlyLevelsFromDaily(dailyCandles) {
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Group daily candles by month
      const monthlyGroups = {};
      dailyCandles.forEach(candle => {
        const date = new Date(candle.t);
        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
        
        if (!monthlyGroups[monthKey]) {
          monthlyGroups[monthKey] = [];
        }
        monthlyGroups[monthKey].push(candle);
      });
      
      // Find last month data
      const lastMonthKey = `${lastMonth.getFullYear()}-${lastMonth.getMonth()}`;
      const prevMonthKey = `${prevMonth.getFullYear()}-${prevMonth.getMonth()}`;
      
      const lastMonthCandles = monthlyGroups[lastMonthKey] || [];
      const prevMonthCandles = monthlyGroups[prevMonthKey] || [];
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        return null;
      }
      
      // Compute levels
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      return {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
    }

    function getCompletedMonths() {
      const now = new Date();
      const nyTime = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
      
      // Get the first day of current month
      const currentMonthStart = new Date(nyTime.getFullYear(), nyTime.getMonth(), 1);
      
      // If we're still in the current month, go back to previous month
      if (nyTime.getTime() < currentMonthStart.getTime()) {
        nyTime.setMonth(nyTime.getMonth() - 1);
      }
      
      // Get last two completed months
      const lastMonth = new Date(nyTime.getFullYear(), nyTime.getMonth() - 1, 1);
      const prevMonth = new Date(nyTime.getFullYear(), nyTime.getMonth() - 2, 1);
      
      console.log('🔍 DEBUG: getCompletedMonths returning:', {
        lastMonth: lastMonth.toISOString().slice(0, 7),
        prevMonth: prevMonth.toISOString().slice(0, 7),
        currentTime: nyTime.toISOString()
      });
      
      return { lastMonth, prevMonth };
    }

    function computeMonthlyLevels(monthlyCandles) {
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Find candles for last completed month
      const lastMonthCandles = monthlyCandles.filter(c => {
        const candleDate = new Date(c.t);
        return candleDate.getFullYear() === lastMonth.getFullYear() && 
               candleDate.getMonth() === lastMonth.getMonth();
      });
      
      // Find candles for previous completed month
      const prevMonthCandles = monthlyCandles.filter(c => {
        const candleDate = new Date(c.t);
        return candleDate.getFullYear() === prevMonth.getFullYear() && 
               candleDate.getMonth() === prevMonth.getMonth();
      });
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        return null;
      }
      
      // Compute levels for last month
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      
      // Compute levels for previous month
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      return {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
    }

    function clearLevelLines() {
      state.levelLines.forEach(line => {
        if (line && line.remove) line.remove();
      });
      state.levelLines = [];
    }

    function drawLevelLines(levels) {
      // 🚨 THIS IS A COMPLETELY NEW FUNCTION - IF YOU SEE THIS, THE CODE IS UPDATING!
      console.log('🚨 CODE UPDATED! NEW FUNCTION IS RUNNING! TIMESTAMP:', new Date().toISOString());
      console.log('🚨 THIS IS THE NEW VERSION 3.2 WITH CHART LIBRARY!');
      
      if (!state.chart || !levels) return;
      
      // Check if we already have the same levels drawn
      if (state.lastDrawnLevels && 
          state.lastDrawnLevels.lml === levels.lml &&
          state.lastDrawnLevels.lmh === levels.lmh &&
          state.lastDrawnLevels.ppml === levels.ppml &&
          state.lastDrawnLevels.ppmh === levels.ppmh) {
        console.log('🚨 Levels already drawn, skipping duplicate draw');
        return;
      }
      
      clearLevelLines();
      
      // Use the chart library's built-in createPriceLine method for accurate positioning
      if (levels.lml != null) {
        console.log('🚨 Creating L.M.L line at price:', levels.lml);
        state.levelLines.push(state.series.createPriceLine({ 
          price: levels.lml, 
          color: '#94a3b8', 
          lineWidth: 2, 
          lineStyle: 1, 
          axisLabelVisible: true, 
          title: 'L.M.L' 
        }));
      }
      
      if (levels.lmh != null) {
        console.log('🚨 Creating L.M.H line at price:', levels.lmh);
        state.levelLines.push(state.series.createPriceLine({ 
          price: levels.lmh, 
          color: '#94a3b8', 
          lineWidth: 2, 
          lineStyle: 1, 
          axisLabelVisible: true, 
          title: 'L.M.H' 
        }));
      }
      
      if (levels.ppml != null) {
        console.log('🚨 Creating P.P.M.L line at price:', levels.ppml);
        state.levelLines.push(state.series.createPriceLine({ 
          price: levels.ppml, 
          color: '#38bdf8', 
          lineWidth: 2, 
          lineStyle: 2, 
          axisLabelVisible: true, 
          title: 'P.P.M.L' 
        }));
      }
      
      if (levels.ppmh != null) {
        console.log('🚨 Creating P.P.M.H line at price:', levels.ppmh);
        state.levelLines.push(state.series.createPriceLine({ 
          price: levels.ppmh, 
          color: '#38bdf8', 
          lineWidth: 2, 
          lineStyle: 2, 
          axisLabelVisible: true, 
          title: 'P.P.M.H' 
        }));
      }
      
      // Store the levels we just drew to prevent duplicates
      state.lastDrawnLevels = {
        lml: levels.lml,
        lmh: levels.lmh,
        ppml: levels.ppml,
        ppmh: levels.ppmh
      };
      console.log('🚨 Levels drawn and stored:', state.lastDrawnLevels);
    }
    
    function getLineColor(className) {
      const colors = {
        lml: '#60a5fa',    // Blue
        lmh: '#10b981',    // Green
        ppml: '#f59e0b',   // Orange
        ppmh: '#ef4444'    // Red
      };
      return colors[className] || '#ffffff';
    }

    function updateLevelsPanel(levels, source = 'monthly') {
      console.log('🔍 DEBUG: updateLevelsPanel called with levels:', {
        lml: levels.lml,
        lmh: levels.lmh,
        ppml: levels.ppml,
        ppmh: levels.ppmh
      });
      console.log('🔍 DEBUG: Panel values being set:', {
        lml: levels.lml,
        lmh: levels.lmh,
        ppml: levels.ppml,
        ppmh: levels.ppmh
      });
      
      if (!levels) {
        document.getElementById('levelsPanel').style.display = 'none';
        return;
      }
      
      document.getElementById('lmlValue').textContent = `$${levels.lml.toFixed(2)}`;
      document.getElementById('lmhValue').textContent = `$${levels.lmh.toFixed(2)}`;
      document.getElementById('ppmlValue').textContent = `$${levels.ppml.toFixed(2)}`;
      document.getElementById('ppmhValue').textContent = `$${levels.ppmh.toFixed(2)}`;
      
      // Hide retry button when we have data
      document.getElementById('retryLevels').style.display = 'none';
      
      document.getElementById('levelsPanel').style.display = 'block';
    }

    // ===== Post-Market Detection Flow =====
    const pmState = { targetPct: 20, lastResetDate: null };
    const pmStore = {
      alerts: [], // {symbol, basePrice, currentPrice, pct, timeSec}
      watchlist: [], // {symbol, level, closePrice, timeSec}
      alertedSet: new Set(), // key: nyDate|symbol
      watchSet: new Set(), // key: nyDate|symbol|level
      regularCloseCache: {}, // key: nyDate|symbol -> price
    };
    let pmMarkers = []; // chart markers for current symbol only

    function nyParts(ms) {
      const d = new Date(ms);
      const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
      const parts = Object.fromEntries(fmt.formatToParts(d).map(p=>[p.type,p.value]));
      const yyyy = parseInt(parts.year), MM = parseInt(parts.month), dd = parseInt(parts.day), hh = parseInt(parts.hour), mm = parseInt(parts.minute);
      return { yyyy, MM, dd, hh, mm };
    }
    function nyDateStr(ms) {
      const { yyyy, MM, dd } = nyParts(ms);
      return `${yyyy}-${String(MM).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    }
    function isRegularHoursNY(ms) {
      const { hh, mm } = nyParts(ms);
      const mins = hh*60 + mm;
      return mins >= (9*60+30) && mins <= (16*60); // 09:30 - 16:00
    }
    function isPostMarketNY(ms) {
      const { hh, mm } = nyParts(ms);
      const mins = hh*60 + mm;
      return mins > (16*60) && mins <= (20*60); // 16:01 - 20:00
    }
    function shouldDailyResetNow() {
      const now = Date.now();
      const date = nyDateStr(now);
      const { hh, mm } = nyParts(now);
      const afterClose = (hh*60+mm) >= (20*60+5); // after 20:05 NY
      return afterClose && pmState.lastResetDate !== date;
    }
    function resetDailyPmState() {
      pmStore.alerts = [];
      pmStore.watchlist = [];

    async function getTodayRegularClose(symbol) {
      const today = nyDateStr(Date.now());
      const key = `${today}|${symbol}`;
      if (pmStore.regularCloseCache[key] != null) return pmStore.regularCloseCache[key];
      try {
        const bars = await fetchCandlesCustom(symbol, '1m', '7d');
        const todays = bars.filter(b => nyDateStr(b.t) === today && isRegularHoursNY(b.t));
        if (!todays.length) return null;
        const last = todays.sort((a,b)=>a.t-b.t)[todays.length-1];
        pmStore.regularCloseCache[key] = last.close;
        return last.close;
      } catch { return null; }
    }
    function addAlertMarkerIfActiveSymbol(symbol, barTimeSec) {
      if (symbol !== state.symbol || !state.series) return;
      // Map to nearest visible series time so the marker shows even if TF != 1m
      const data = state.series.data() || [];
      let mapped = barTimeSec;
      if (data.length) {
        let best = data[0].time, bestDiff = Math.abs(data[0].time - barTimeSec);
        for (let i=1;i<data.length;i++) {
          const d = Math.abs(data[i].time - barTimeSec);
          if (d < bestDiff) { best = data[i].time; bestDiff = d; }
        }
        mapped = best;
      }
      pmMarkers.push({ time: mapped, position: 'aboveBar', color: '#10b981', shape: 'arrowUp', text: 'PM +17%' });
      updateMarkers();
    }
    function addWatchlistMarkerIfActiveSymbol(symbol, barTimeSec) {
      if (symbol !== state.symbol || !state.series) return;
      pmMarkers.push({ time: barTimeSec, position: 'aboveBar', color: '#38bdf8', shape: 'circle', text: 'Added to PM Watchlist' });
      updateMarkers();
    }
    // Detect Stage 1 for a single symbol (latest/current post-market):
    // Trigger when within any rolling 1-hour window the gain ≥ 17%.
    async function detectPostMarketMoveForSymbol(symbol) {
      const now = Date.now();
      let bars = [];
      try { bars = await fetchCandlesCustom(symbol, '1m', '7d'); } catch { return; }
      if (!bars.length) return;
      // Group by NY date to find the latest day with any post-market bars
      const byDate = new Map();
      for (const b of bars) {
        const d = nyDateStr(b.t);
        if (!byDate.has(d)) byDate.set(d, []);
        byDate.get(d).push(b);
      }
      const dates = Array.from(byDate.keys()).sort();
      let targetDate = null, pmBars = [];
      for (let i=dates.length-1; i>=0; i--) {
        const dayBars = byDate.get(dates[i]);
        const pm = dayBars.filter(x => isPostMarketNY(x.t));
        if (pm.length) { targetDate = dates[i]; pmBars = pm.sort((a,b)=>a.t-b.t); break; }
      }
      if (!targetDate || !pmBars.length) return;
      // Rolling 1-hour window over post-market bars
      let startIdx = 0;
      for (let i = 0; i < pmBars.length; i++) {
        const end = pmBars[i];
        const cutoff = end.time - 3600; // seconds
        while (startIdx < i && pmBars[startIdx].time < cutoff) startIdx++;
        const base = pmBars[startIdx];
        if (!base) continue;
        if (base.close === 0) continue;
        const change = (end.close - base.close) / base.close;
        if (change >= 0.17) {
          const key = `${targetDate}|${symbol}`;
          if (!pmStore.alertedSet.has(key)) {
            pmStore.alertedSet.add(key);
            pmStore.alerts.push({ symbol, basePrice: base.close, currentPrice: end.close, pct: change, timeSec: end.time });
            renderPmAlerts();
            activatePmTab();
            addAlertMarkerIfActiveSymbol(symbol, end.time);
          }
          break;
        }
      }
    }
    // Detect Stage 2 for a single symbol
    async function checkLevelConfirmationForSymbol(symbol) {
      const now = Date.now();
      if (!isPostMarketNY(now)) return;
      const today = nyDateStr(now);
      if (!pmStore.alertedSet.has(`${today}|${symbol}`)) return; // only after alert

      // Resolve key levels for symbol
      let lv = null;
      if (symbol === state.symbol && state.monthlyLevels) {
        lv = state.monthlyLevels;
      } else {
        // fetch daily 90d and compute monthly levels
        try {
          const resp = await fetch(`/api/candles?symbol=${encodeURIComponent(symbol)}&timespan=day&window=90d`);
          const data = await resp.json();
          const daily = (data.candles||[]).map(c => ({ t: c.t, high: c.h, low: c.l }));
          lv = computeMonthlyLevelsFromDaily(daily);
        } catch { lv = null; }
      }
      if (!lv) return;

      const bars = await fetchCandlesCustom(symbol, '1m', '2d');
      const pmBars = bars.filter(b => nyDateStr(b.t) === today && isPostMarketNY(b.t)).sort((a,b)=>a.t-b.t);
      if (!pmBars.length) return;

      const levels = [
        { key: 'L.M.H', value: lv.lmh },
        { key: 'L.M.L', value: lv.lml },
        { key: 'P.P.M.H', value: lv.ppmh },
        { key: 'P.P.M.L', value: lv.ppml },
      ].filter(x => x.value != null);

      for (const L of levels) {
        const watchKey = `${today}|${symbol}|${L.key}`;
        if (pmStore.watchSet.has(watchKey)) continue;
        // find crossing time: first bar whose high >= level
        const crossed = pmBars.find(b => b.high >= L.value);
        if (!crossed) continue;
        const crossTime = crossed.time;
        const limitSec = crossTime + 3600; // 1 hour window
        // find a confirmation close above level within 1 hour
        const confirm = pmBars.find(b => b.time > crossTime && b.time <= limitSec && b.close >= L.value);
        if (confirm) {
          pmStore.watchSet.add(watchKey);
          pmStore.watchlist.push({ symbol, level: L.key, closePrice: confirm.close, timeSec: confirm.time });
          renderPmWatchlist();
          addWatchlistMarkerIfActiveSymbol(symbol, confirm.time);
        }
      }
    }

    async function loadMonthlyLevels(symbol) {
      try {
        // Wait for chart to be ready
        if (!state.chart || !state.series) {
          setTimeout(() => loadMonthlyLevels(symbol), 1000);
          return;
        }
        
        // Get the candlestick data from the series
        const seriesData = state.series.data();
        
        if (!seriesData || seriesData.length === 0) {
          // Wait a bit for data to load, then try again
          setTimeout(() => loadMonthlyLevels(symbol), 1000);
          return;
        }
        
        // Compute monthly levels from existing candlestick data
        const levels = computeMonthlyLevelsFromCandles(seriesData);
        
        alert('🔄 NEW CODE IS RUNNING! VERSION 1.0 - LEVELS COMPUTED - TIMESTAMP: ' + new Date().toISOString());
        console.log('🔄 FORCED REFRESH - NEW CODE VERSION 1.0 - TIMESTAMP:', new Date().toISOString());
        console.log('🔍 DEBUG: Levels computed from candles:', {
          lml: levels.lml,
          lmh: levels.lmh,
          ppml: levels.ppml,
          ppmh: levels.ppmh
        });
        
        if (levels) {
          // Store the levels and mark them as computed for this symbol
          state.monthlyLevels = levels;
          state.lastComputedSymbol = symbol;
          console.log('🔍 DEBUG: Levels stored in state:', {
            lml: state.monthlyLevels.lml,
            lmh: state.monthlyLevels.lmh,
            ppml: state.monthlyLevels.ppml,
            ppmh: state.monthlyLevels.ppmh
          });
          
          updateLevelsPanel(levels, 'chart');
          console.log('🔍 DEBUG: Levels panel updated with:', {
            lml: levels.lml,
            lmh: levels.lmh,
            ppml: levels.ppml,
            ppmh: levels.ppmh
          });
          
          console.log('🔍 DEBUG: About to call drawLevelLines with:', {
            lml: levels.lml,
            lmh: levels.lmh,
            ppml: levels.ppml,
            ppmh: levels.ppmh
          });
          drawLevelLines(levels);
          return;
        } else {
          // If we can't compute from current data, try to get more historical data
          // by temporarily switching to a larger window
          const originalWindow = state.window;
          
          if (state.window !== 'max') {
            state.window = 'max';
            await loadSymbol(symbol);
            
            // Wait for data to load, then try again
            setTimeout(async () => {
              const newSeriesData = state.series.data();
              const levelsFromMax = computeMonthlyLevelsFromCandles(newSeriesData);
              
              if (levelsFromMax) {
                // Store the levels and mark them as computed for this symbol
                state.monthlyLevels = levelsFromMax;
                state.lastComputedSymbol = symbol;
                updateLevelsPanel(levelsFromMax, 'chart');
                drawLevelLines(levelsFromMax);
              }
              
              // Restore original window
              state.window = originalWindow;
              await loadSymbol(symbol);
            }, 2000);
            
            return;
          }
        }
      } catch (e) {
        console.log('Failed to compute monthly levels from chart data:', e.message);
      }
      
      // If all approaches failed - show retry option
      state.monthlyLevels = null;
      document.getElementById('levelsPanel').style.display = 'block';
      document.getElementById('levelsSource').textContent = 'Unable to compute monthly levels from chart data';
      document.getElementById('retryLevels').style.display = 'block';
      clearLevelLines();
      showError('Unable to compute monthly levels from available chart data. Please try again later.');
    }



    async function loadSymbol(symbol) {
      showError('');
      try {
        await ensureChart();
        const candles = await fetchCandles(symbol);
        if (!candles.length) throw new Error('No candles returned.');
        const allCandles = candles.map(c => ({ 
          time: c.time, 
          open: c.open, 
          high: c.high, 
          low: c.low, 
          close: c.close 
        }));
        state.series.setData(allCandles);
        state.symbol = symbol.toUpperCase();
        title.textContent = `${state.symbol} • ${state.timespan}`;
        renderWatch();
        
        // Load monthly levels for the new symbol (only if symbol changed or no levels exist)
        if (state.lastComputedSymbol !== symbol || !state.monthlyLevels) {
          await loadMonthlyLevels(symbol);
        } else {
          console.log('🔍 DEBUG: Reusing existing levels for symbol:', symbol);
          // Redraw existing levels for the new timeframe
          if (state.monthlyLevels) {
            drawLevelLines(state.monthlyLevels);
          }
        }

        // Evaluate post-market strategy if enabled
        if (pmState.enabled) evaluatePostMarketStrategy();
      } catch (e) {
        showError(String(e && e.message ? e.message : e));
      }
    }

    // --- Post Market Strategy (simple evaluation) ---
    function isPostMarket(ms) {
      const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute:'2-digit', hour12:false });
      const [hh, mm] = fmt.format(new Date(ms)).split(':').map(Number);
      const mins = hh*60 + mm;
      return mins > 16*60 && mins <= 20*60; // 16:01 - 20:00 NY
    }
    function computePostMarketHigh(seriesData) {
      if (!seriesData || !seriesData.length) return null;
      // find latest date with any post-market bars
      const byDay = new Map();
      seriesData.forEach(c => {
        const d = new Date(c.time * 1000);
        const y = d.getUTCFullYear(), m = d.getUTCMonth()+1, day = d.getUTCDate();
        const key = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if (isPostMarket(c.t)) {
          if (!byDay.has(key)) byDay.set(key, []);
          byDay.get(key).push(c);
        }
      });
      const keys = Array.from(byDay.keys()).sort();
      if (!keys.length) return null;
      const latest = byDay.get(keys[keys.length-1]);
      if (!latest || !latest.length) return null;
      return Math.max(...latest.map(b => b.high));
    }
    function evaluatePostMarketStrategy() {
      if (!pmState.enabled || !state || !state.series) return;
      const data = state.series.data();
      if (!data || !data.length) return;
      // filter latest post-market group
      const pmHigh = computePostMarketHigh(data);
      document.getElementById('pmHighValue').textContent = (pmHigh != null) ? `$${pmHigh.toFixed(2)}` : '—';
      // signal based on open vs last closed within post-market
      const pmBars = data.filter(b => isPostMarket(b.t)).sort((a,b)=>a.time-b.time);
      if (!pmBars.length) { document.getElementById('pmSignalValue').textContent = 'No Signal'; return; }
      const pmOpen = pmBars[0].open;
      const nowSec = Math.floor(Date.now()/1000);
      const closed = pmBars.filter(b => (nowSec - b.time) > 60);
      const last = (closed.length ? closed[closed.length-1] : pmBars[pmBars.length-1]);
      const gain = ((last.close - pmOpen) / pmOpen) * 100;
      const triggered = gain >= pmState.targetPct;
      document.getElementById('pmSignalValue').textContent = triggered ? `Buy Signal Triggered at $${last.close.toFixed(2)}` : 'No Signal';
    }
