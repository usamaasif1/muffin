  /* Optional default. You can still override with ?api=<base> in the URL */
  window.__CONFIG__ = window.__CONFIG__ || {
    API_BASE_URL: "https://muffin-64tv.onrender.com/api"
  };
</script>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAPL Chart (Simple)</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1022; color: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; border-bottom: 1px solid #1f2937; background: #0f172a; }
    main { flex: 1; display: grid; grid-template-columns: 240px 1fr; }
    #sidebar { border-right: 1px solid #1f2937; padding: 10px; }
    #watch { display: flex; flex-direction: column; gap: 6px; }
    .watch-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid #374151; border-radius: 8px; cursor: pointer; }
    .watch-item .rm { margin-left: 10px; color: #fca5a5; cursor: pointer; }
    #chart { width: 100%; height: calc(100vh - 54px); position: relative; }
    #msg { padding: 6px 12px; color: #fca5a5; font-size: 13px; white-space: pre-wrap; }
    #topbar { display:flex; gap:10px; align-items:center; }
    #search { width: 320px; padding: 8px 10px; border-radius: 8px; border: 1px solid #374151; background: #0a0f20; color: #e5e7eb; }
    #go { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #2563eb; color: white; cursor: pointer; }
    #add { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #10b981; color: white; cursor: pointer; }
    #apiBadge { margin-left: 10px; font-size: 12px; color: #94a3b8; }
    #levelsPanel { position: fixed; right: 20px; top: 80px; width: 200px; background: #0f172a; border: 1px solid #374151; border-radius: 8px; padding: 16px; z-index: 1000; }
    .level-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .level-item:last-child { margin-bottom: 0; }
    .level-label { color: #94a3b8; }
    .level-value { color: #e5e7eb; font-weight: 500; }
    .level-line { 
      position: absolute; 
      height: 3px; 
      width: 100%; 
      opacity: 0.9; 
      z-index: 1000;
      pointer-events: none;
    }
    .level-line.lml { background: #60a5fa; }
    .level-line.lmh { background: #10b981; }
    .level-line.ppml { background: #f59e0b; }
    .level-line.ppmh { background: #ef4444; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div id="topbar">
        <div id="title">AAPL • 15m</div>
        <input id="search" list="symbols" placeholder="Search ticker (AAPL, TSLA, apple)" />
        <datalist id="symbols"></datalist>
        <button id="go">Go</button>
        <div style="margin-left:auto; display:flex; gap:6px;">
          <button class="tf" data-tf="1m">1m</button>
          <button class="tf" data-tf="5m">5m</button>
          <button class="tf" data-tf="15m">15m</button>
          <button class="tf" data-tf="1h">1h</button>
          <button class="tf" data-tf="day">1d</button>
          <button class="tf" data-tf="month">1mo</button>
          <button id="add">+ Add</button>
        </div>
        <span id="apiBadge"></span>
      </div>
    </header>
    <div id="msg"></div>
    <main>
      <aside id="sidebar">
        <div class="small" style="color:#94a3b8;margin-bottom:6px;">Watchlist</div>
        <div id="watch"></div>
      </aside>
      <div id="chart"></div>
    </main>
    
    <!-- Levels Panel -->
    <div id="levelsPanel" style="display: none;">
      <div style="margin-bottom: 12px; font-weight: 600; color: #e5e7eb; font-size: 14px;">Monthly Levels</div>
      <div id="levelsSource" style="margin-bottom: 8px; font-size: 11px; color: #94a3b8; font-style: italic;"></div>
      <div class="level-item">
        <span class="level-label">L.M.L:</span>
        <span class="level-value" id="lmlValue">-</span>
      </div>
      <div class="level-item">
        <span class="level-label">L.M.H:</span>
        <span class="level-value" id="lmhValue">-</span>
      </div>
      <div class="level-item">
        <span class="level-label">P.P.M.L:</span>
        <span class="level-value" id="ppmlValue">-</span>
      </div>
      <div class="level-item">
        <span class="level-label">P.P.M.H:</span>
        <span class="level-value" id="ppmhValue">-</span>
      </div>
      <button id="retryLevels" style="margin-top: 12px; width: 100%; padding: 6px; background: #374151; border: 1px solid #4b5563; color: #e5e7eb; border-radius: 4px; cursor: pointer; font-size: 12px; display: none;">Retry</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // -------- API base resolver (scoped, no globals) --------
    const params = new URLSearchParams(location.search);
    const apiOverride = params.get('api');
    const cfgApi = (window.__CONFIG__ && window.__CONFIG__.API_BASE_URL) || '';
    const API_BASE_URL = (apiOverride && apiOverride.trim()) || (cfgApi && cfgApi.trim()) || '/api';

    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    const title = $('title');
    const search = $('search');
    const dl = $('symbols');
    const goBtn = $('go');
    const addBtn = $('add');
    const watchEl = $('watch');
    const apiBadge = $('apiBadge');

    const state = {
      symbol: 'AAPL',
      timespan: '15m',
      window: 'max',
      chart: null,
      series: null,
      watch: JSON.parse(localStorage.getItem('simple.watch') || '[]'),
      monthlyLevels: null,
      levelLines: []
    };

    function apiUrl(endpoint, query) {
      const base = API_BASE_URL.replace(/\/+$/, '');
      const path = String(endpoint || '').replace(/^\/+/, '');
      let url = `${base}/${path}`;
      if (query) url += (query[0] === '?' ? query : `?${query}`);
      return url;
    }

    function showError(text) { msg.textContent = text || ''; }

    async function ensureChart() {
      if (state.chart && state.series) return;
      if (!window.LightweightCharts || typeof window.LightweightCharts.createChart !== 'function') {
        throw new Error('Chart library failed to load.');
      }
      state.chart = window.LightweightCharts.createChart($('chart'), {
        layout: { background: { color: '#0b1022' }, textColor: '#e5e7eb' },
        rightPriceScale: { borderColor: '#1f2937' },
        timeScale: { borderColor: '#1f2937', timeVisible: true, secondsVisible: false },
        grid: { vertLines: { color: '#111827' }, horzLines: { color: '#111827' } }
      });
      state.series = state.chart.addCandlestickSeries({
        upColor: '#0ec07f', downColor: '#ff4d4f', borderDownColor: '#ff4d4f', borderUpColor: '#0ec07f', wickDownColor: '#ff4d4f', wickUpColor: '#0ec07f'
      });
    }

    async function fetchCandles(symbol) {
      const url = apiUrl('candles', `symbol=${encodeURIComponent(symbol)}&timespan=${state.timespan}&window=${state.window}`);
      const resp = await fetch(url);
      if (!resp.ok) {
        const txt = await resp.text().catch(()=>'');
        throw new Error('Failed to get candles: ' + txt);
      }
      const data = await resp.json();
      return (data.candles || []).map(c => ({
        time: Math.floor(c.t / 1000), open: c.o, high: c.h, low: c.l, close: c.c, t: c.t
      }));
    }

    // Compute monthly levels from existing candlestick data
    function computeMonthlyLevelsFromCandles(candles) {
      console.log('🔍 DEBUG: computeMonthlyLevelsFromCandles called with:', candles.length, 'candles');
      console.log('🔍 DEBUG: First few candles:', candles.slice(0, 3));
      console.log('🔍 DEBUG: Last few candles:', candles.slice(-3));
      
      if (!candles || candles.length === 0) return null;
      
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Group candles by month based on their timestamp
      const monthlyGroups = {};
      candles.forEach(candle => {
        const date = new Date(candle.time * 1000); // Convert back to milliseconds
        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
        
        if (!monthlyGroups[monthKey]) {
          monthlyGroups[monthKey] = [];
        }
        monthlyGroups[monthKey].push(candle);
      });
      
      // Find last month data
      const lastMonthKey = `${lastMonth.getFullYear()}-${lastMonth.getMonth()}`;
      const prevMonthKey = `${prevMonth.getFullYear()}-${prevMonth.getMonth()}`;
      
      const lastMonthCandles = monthlyGroups[lastMonthKey] || [];
      const prevMonthCandles = monthlyGroups[prevMonthKey] || [];
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        return null;
      }
      
      // Compute levels
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      return {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
    }

    function computeMonthlyLevelsFromDaily(dailyCandles) {
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Group daily candles by month
      const monthlyGroups = {};
      dailyCandles.forEach(candle => {
        const date = new Date(candle.t);
        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
        
        if (!monthlyGroups[monthKey]) {
          monthlyGroups[monthKey] = [];
        }
        monthlyGroups[monthKey].push(candle);
      });
      
      // Find last month data
      const lastMonthKey = `${lastMonth.getFullYear()}-${lastMonth.getMonth()}`;
      const prevMonthKey = `${prevMonth.getFullYear()}-${prevMonth.getMonth()}`;
      
      const lastMonthCandles = monthlyGroups[lastMonthKey] || [];
      const prevMonthCandles = monthlyGroups[prevMonthKey] || [];
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        return null;
      }
      
      // Compute levels
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      return {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
    }

    function getCompletedMonths() {
      const now = new Date();
      const nyTime = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
      
      // Get the first day of current month
      const currentMonthStart = new Date(nyTime.getFullYear(), nyTime.getMonth(), 1);
      
      // If we're still in the current month, go back to previous month
      if (nyTime.getTime() < currentMonthStart.getTime()) {
        nyTime.setMonth(nyTime.getMonth() - 1);
      }
      
      // Get last two completed months
      const lastMonth = new Date(nyTime.getFullYear(), nyTime.getMonth() - 1, 1);
      const prevMonth = new Date(nyTime.getFullYear(), nyTime.getMonth() - 2, 1);
      
      console.log('🔍 DEBUG: getCompletedMonths returning:', {
        lastMonth: lastMonth.toISOString().slice(0, 7),
        prevMonth: prevMonth.toISOString().slice(0, 7),
        currentTime: nyTime.toISOString()
      });
      
      return { lastMonth, prevMonth };
    }

    function computeMonthlyLevels(monthlyCandles) {
      const { lastMonth, prevMonth } = getCompletedMonths();
      
      // Find candles for last completed month
      const lastMonthCandles = monthlyCandles.filter(c => {
        const candleDate = new Date(c.t);
        return candleDate.getFullYear() === lastMonth.getFullYear() && 
               candleDate.getMonth() === lastMonth.getMonth();
      });
      
      // Find candles for previous completed month
      const prevMonthCandles = monthlyCandles.filter(c => {
        const candleDate = new Date(c.t);
        return candleDate.getFullYear() === prevMonth.getFullYear() && 
               candleDate.getMonth() === prevMonth.getMonth();
      });
      
      if (lastMonthCandles.length === 0 || prevMonthCandles.length === 0) {
        return null;
      }
      
      // Compute levels for last month
      const lastMonthHigh = Math.max(...lastMonthCandles.map(c => c.high));
      const lastMonthLow = Math.min(...lastMonthCandles.map(c => c.low));
      
      // Compute levels for previous month
      const prevMonthHigh = Math.max(...prevMonthCandles.map(c => c.high));
      const prevMonthLow = Math.min(...prevMonthCandles.map(c => c.low));
      
      return {
        lml: lastMonthLow,
        lmh: lastMonthHigh,
        ppml: prevMonthLow,
        ppmh: prevMonthHigh
      };
    }

    function clearLevelLines() {
      state.levelLines.forEach(line => {
        if (line && line.remove) line.remove();
      });
      state.levelLines = [];
    }

    function drawLevelLines(levels) {
      console.log('🔍 DEBUG: drawLevelLines called with levels:', levels);
      console.log('🔍 DEBUG: Levels object keys:', Object.keys(levels));
      console.log('🔍 DEBUG: Individual level values:', {
        lml: levels.lml,
        lmh: levels.lmh,
        ppml: levels.ppml,
        ppmh: levels.ppmh
      });
      
      if (!state.chart || !levels) return;
      
      clearLevelLines();
      
      // Get the chart container and ensure it has proper positioning
      const chartContainer = document.getElementById('chart');
      if (!chartContainer) return;
      
      // Get the chart's dimensions and position
      const chartRect = chartContainer.getBoundingClientRect();
      const chartStyle = window.getComputedStyle(chartContainer);
      
      // Get the current candlestick data
      const seriesData = state.series.data();
      if (!seriesData || seriesData.length === 0) return;
      
      // Find the overall price range from all data
      const allPrices = [];
      seriesData.forEach(candle => {
        allPrices.push(candle.low, candle.high);
      });
      
      const minPrice = Math.min(...allPrices);
      const maxPrice = Math.max(...allPrices);
      const priceRange = maxPrice - minPrice;
      
      console.log('Drawing level lines:', {
        levels,
        minPrice,
        maxPrice,
        priceRange,
        chartHeight: chartRect.height,
        chartWidth: chartRect.width
      });
      
      const lineConfigs = [
        { level: levels.lml, class: 'lml', label: 'L.M.L' },
        { level: levels.lmh, class: 'lmh', label: 'L.M.H' },
        { level: levels.ppml, class: 'ppml', label: 'P.P.M.L' },
        { level: levels.ppmh, class: 'ppmh', label: 'P.P.M.H' }
      ];
      
      lineConfigs.forEach(config => {
        // Calculate Y position based on price level relative to overall range
        const pricePosition = (config.level - minPrice) / priceRange;
        const y = chartRect.height * (1 - pricePosition); // Invert Y axis (0 is top)
        
        console.log(`Line ${config.label}:`, {
          price: config.level,
          pricePosition,
          y,
          isValid: y >= 0 && y <= chartRect.height
        });
        
        if (y >= 0 && y <= chartRect.height) {
          const line = document.createElement('div');
          line.className = `level-line ${config.class}`;
          
          // Fix positioning - use fixed positioning relative to chart container
          line.style.position = 'absolute';
          line.style.left = '0px';
          line.style.right = '0px';
          line.style.top = `${y}px`;
          line.style.width = '100%';
          line.style.height = '3px'; // Make lines more visible
          line.style.zIndex = '1000'; // Ensure lines appear above everything
          line.style.backgroundColor = getLineColor(config.class);
          line.style.pointerEvents = 'none'; // Prevent lines from blocking chart interaction
          
          // Add label on the right side
          const label = document.createElement('span');
          label.textContent = config.label;
          label.style.position = 'absolute';
          label.style.right = '15px';
          label.style.top = '-10px';
          label.style.fontSize = '11px';
          label.style.color = getLineColor(config.class);
          label.style.fontWeight = 'bold';
          label.style.backgroundColor = 'rgba(0,0,0,0.8)';
          label.style.padding = '2px 6px';
          label.style.borderRadius = '3px';
          label.style.pointerEvents = 'none';
          line.appendChild(label);
          
          // Append to chart container
          chartContainer.appendChild(line);
          state.levelLines.push(line);
          
          console.log(`Created line for ${config.label} at y=${y}`);
        }
      });
    }
    
    function getLineColor(className) {
      const colors = {
        lml: '#60a5fa',    // Blue
        lmh: '#10b981',    // Green
        ppml: '#f59e0b',   // Orange
        ppmh: '#ef4444'    // Red
      };
      return colors[className] || '#ffffff';
    }

    function updateLevelsPanel(levels, source = 'monthly') {
      console.log('🔍 DEBUG: updateLevelsPanel called with levels:', levels);
      console.log('🔍 DEBUG: Panel values being set:', {
        lml: levels.lml,
        lmh: levels.lmh,
        ppml: levels.ppml,
        ppmh: levels.ppmh
      });
      
      if (!levels) {
        document.getElementById('levelsPanel').style.display = 'none';
        return;
      }
      
      document.getElementById('lmlValue').textContent = `$${levels.lml.toFixed(2)}`;
      document.getElementById('lmhValue').textContent = `$${levels.lmh.toFixed(2)}`;
      document.getElementById('ppmlValue').textContent = `$${levels.ppml.toFixed(2)}`;
      document.getElementById('ppmhValue').textContent = `$${levels.ppmh.toFixed(2)}`;
      
      // Update source indicator
      const sourceEl = document.getElementById('levelsSource');
      if (source === 'monthly') {
        sourceEl.textContent = 'Source: Monthly data';
      } else if (source === 'daily') {
        sourceEl.textContent = 'Source: Daily data (monthly rate limited)';
      } else if (source === 'chart') {
        sourceEl.textContent = 'Source: Chart data';
      }
      
      // Hide retry button when we have data
      document.getElementById('retryLevels').style.display = 'none';
      
      document.getElementById('levelsPanel').style.display = 'block';
    }

    async function loadMonthlyLevels(symbol) {
      try {
        // Wait for chart to be ready
        if (!state.chart || !state.series) {
          setTimeout(() => loadMonthlyLevels(symbol), 1000);
          return;
        }
        
        // Get the candlestick data from the series
        const seriesData = state.series.data();
        
        if (!seriesData || seriesData.length === 0) {
          // Wait a bit for data to load, then try again
          setTimeout(() => loadMonthlyLevels(symbol), 1000);
          return;
        }
        
        // Compute monthly levels from existing candlestick data
        const levels = computeMonthlyLevelsFromCandles(seriesData);
        
        console.log('🔍 DEBUG: Levels computed from candles:', levels);
        
        if (levels) {
          // Store the levels and mark them as computed for this symbol
          state.monthlyLevels = levels;
          state.lastComputedSymbol = symbol;
          console.log('🔍 DEBUG: Levels stored in state:', state.monthlyLevels);
          
          updateLevelsPanel(levels, 'chart');
          console.log('🔍 DEBUG: Levels panel updated with:', levels);
          
          console.log('🔍 DEBUG: About to call drawLevelLines with:', levels);
          drawLevelLines(levels);
          return;
        } else {
          // If we can't compute from current data, try to get more historical data
          // by temporarily switching to a larger window
          const originalWindow = state.window;
          
          if (state.window !== 'max') {
            state.window = 'max';
            await loadSymbol(symbol);
            
            // Wait for data to load, then try again
            setTimeout(async () => {
              const newSeriesData = state.series.data();
              const levelsFromMax = computeMonthlyLevelsFromCandles(newSeriesData);
              
              if (levelsFromMax) {
                // Store the levels and mark them as computed for this symbol
                state.monthlyLevels = levelsFromMax;
                state.lastComputedSymbol = symbol;
                updateLevelsPanel(levelsFromMax, 'chart');
                drawLevelLines(levelsFromMax);
              }
              
              // Restore original window
              state.window = originalWindow;
              await loadSymbol(symbol);
            }, 2000);
            
            return;
          }
        }
      } catch (e) {
        console.log('Failed to compute monthly levels from chart data:', e.message);
      }
      
      // If all approaches failed - show retry option
      state.monthlyLevels = null;
      document.getElementById('levelsPanel').style.display = 'block';
      document.getElementById('levelsSource').textContent = 'Unable to compute monthly levels from chart data';
      document.getElementById('retryLevels').style.display = 'block';
      clearLevelLines();
      showError('Unable to compute monthly levels from available chart data. Please try again later.');
    }



    async function loadSymbol(symbol) {
      showError('');
      try {
        await ensureChart();
        const candles = await fetchCandles(symbol);
        if (!candles.length) throw new Error('No candles returned.');
        const allCandles = candles.map(c => ({ 
          time: c.time, 
          open: c.open, 
          high: c.high, 
          low: c.low, 
          close: c.close 
        }));
        state.series.setData(allCandles);
        state.symbol = symbol.toUpperCase();
        title.textContent = `${state.symbol} • ${state.timespan}`;
        renderWatch();
        
        // Load monthly levels for the new symbol (only if symbol changed or no levels exist)
        if (state.lastComputedSymbol !== symbol || !state.monthlyLevels) {
          await loadMonthlyLevels(symbol);
        } else {
          console.log('🔍 DEBUG: Reusing existing levels for symbol:', symbol);
          // Redraw existing levels for the new timeframe
          if (state.monthlyLevels) {
            drawLevelLines(state.monthlyLevels);
          }
        }
      } catch (e) {
        showError(String(e && e.message ? e.message : e));
      }
    }

    async function searchSymbols(q) {
      if (!q || q.length < 1) return [];
      try {
        const resp = await fetch(apiUrl('search', `q=${encodeURIComponent(q)}`));
        if (!resp.ok) return [];
        const data = await resp.json();
        return data.items || [];
      } catch { return []; }
    }

    function saveWatch() { localStorage.setItem('simple.watch', JSON.stringify(state.watch)); }
    function renderWatch() {
      watchEl.innerHTML = '';
      state.watch.forEach(sym => {
        const row = document.createElement('div');
        row.className = 'watch-item';
        const name = document.createElement('span');
        name.textContent = sym;
        const rm = document.createElement('span');
        rm.className = 'rm';
        rm.textContent = '×';
        rm.onclick = (ev) => { ev.stopPropagation(); state.watch = state.watch.filter(s => s !== sym); saveWatch(); renderWatch(); };
        row.onclick = () => loadSymbol(sym);
        row.appendChild(name);
        row.appendChild(rm);
        watchEl.appendChild(row);
      });
    }

    // UI events
    search.addEventListener('input', async () => {
      const q = search.value.trim();
      const items = await searchSymbols(q);
      dl.innerHTML = '';
      items.slice(0, 10).forEach(it => {
        const opt = document.createElement('option');
        opt.value = it.symbol;
        opt.label = it.name || it.symbol;
        dl.appendChild(opt);
      });
    });
    search.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const s = search.value.trim(); if (s) loadSymbol(s); } });
    goBtn.addEventListener('click', () => { const s = search.value.trim(); if (s) loadSymbol(s); });
    addBtn.addEventListener('click', () => {
      const sym = (search.value || '').trim().toUpperCase();
      if (!sym) return;
      if (!state.watch.includes(sym)) { state.watch.push(sym); saveWatch(); renderWatch(); }
    });
    document.querySelectorAll('.tf').forEach(btn => {
      btn.addEventListener('click', async () => {
        state.timespan = btn.getAttribute('data-tf');
        await loadSymbol(state.symbol);
        
        // Redraw level lines for the new timeframe (without recomputing levels)
        if (state.monthlyLevels) {
          console.log('🔍 DEBUG: Redrawing levels for timeframe change:', state.timespan);
          drawLevelLines(state.monthlyLevels);
        }
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      apiBadge.textContent = `API: ${API_BASE_URL}`;
      renderWatch();
      loadSymbol('AAPL');
      
      // Add chart resize handler
      window.addEventListener('resize', () => {
        if (state.monthlyLevels && state.chart) {
          console.log('🔍 DEBUG: Redrawing levels for window resize');
          drawLevelLines(state.monthlyLevels);
        }
      });
      
      // Add retry button handler
      document.getElementById('retryLevels').addEventListener('click', () => {
        if (state.symbol) {
          loadMonthlyLevels(state.symbol);
        }
      });
    });
  })();
  </script>
</body>
</html>
