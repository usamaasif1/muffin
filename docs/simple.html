  <style>
    html, body { height: 100%; margin: 0; background: #0b1022; color: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; border-bottom: 1px solid #1f2937; background: #0f172a; }
    /* Layout: left watchlist (200px) • centered chart (1fr) • right tabs (240px) */
    main { flex: 1; display: grid; grid-template-columns: 200px 1fr 240px; transition: grid-template-columns 0.2s ease; }
    /* Collapsible panels */
    .collapsed-left main { grid-template-columns: 0 1fr 240px; }
    .collapsed-left #sidebar { display: none; }
    .collapsed-right main { grid-template-columns: 200px 1fr 0; }
    .collapsed-right #rightPanel { display: none; }
    .collapsed-left.collapsed-right main { grid-template-columns: 0 1fr 0; }
    #sidebar { border-right: 1px solid #1f2937; padding: 10px; }
    #watch { display: flex; flex-direction: column; gap: 6px; }
    .watch-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid #374151; border-radius: 8px; cursor: pointer; }
    .watch-item .rm { margin-left: 10px; color: #fca5a5; cursor: pointer; }
    #chart { width: 100%; height: calc(100vh - 54px); position: relative; }
    /* Session shading overlay */
    #sessionShades { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .session-shade { position: absolute; top: 0; height: 100%; pointer-events: none; }
    .session-shade.pre { background: rgba(59, 130, 246, 0.08); }
    .session-shade.post { background: rgba(244, 63, 94, 0.08); }
    #sessionShades { z-index: 100; }
    #msg { padding: 6px 12px; color: #fca5a5; font-size: 13px; white-space: pre-wrap; }
    #topbar { display:flex; gap:10px; align-items:center; }
    #search { width: 320px; padding: 8px 10px; border-radius: 8px; border: 1px solid #374151; background: #0a0f20; color: #e5e7eb; }
    #go { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #2563eb; color: white; cursor: pointer; }
    #add { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #10b981; color: white; cursor: pointer; }
    /* Right-side tabs scaffold (extensible for future tabs) */
    #rightPanel { border-left: 1px solid #1f2937; padding: 10px; }
    #tabBar { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab-btn { padding: 6px 8px; border: 1px solid #374151; border-radius: 6px; background: #0a0f20; color: #e5e7eb; cursor: pointer; }
    .tab-btn.active { background: #1f2937; }
    .panel-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .levels { display: grid; gap: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
    /* Alerts list items with status light */
    #alertsList { display: flex; flex-direction: column; gap: 6px; }
    .alert-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid #374151; border-radius: 6px; background: #0a0f20; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.7); flex: 0 0 auto; }
    /* Levels panel now lives in the right panel (not fixed overlay) */
    #levelsPanel { display: none; background: #0f172a; border: 1px solid #374151; border-radius: 8px; padding: 16px; }
    .level-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .level-item:last-child { margin-bottom: 0; }
    .level-label { color: #94a3b8; }
    .level-value { color: #e5e7eb; font-weight: 500; }
    .level-line { 
      position: absolute; 
      height: 3px; 
      width: 100%; 
      opacity: 0.9; 
      z-index: 1000;
      pointer-events: none;
    }
    .level-line.lml { background: #60a5fa; }
    .level-line.lmh { background: #10b981; }
    .level-line.ppml { background: #f59e0b; }
    .level-line.ppmh { background: #ef4444; }
    /* PM UI removed */
    /* Hover info panel like TradingView */
    .hover-info { position: absolute; top: 6px; left: 6px; background: rgba(15,23,42,0.9); border: 1px solid #374151; border-radius: 6px; padding: 6px 8px; font-size: 12px; color: #e5e7eb; pointer-events: none; display: none; z-index: 2000; }
    .pos { color: #10b981; }
    .neg { color: #ef4444; }
    /* Minimal styles for alerts/watchlist */
    .panel-title { color: #94a3b8; font-size: 12px; margin: 6px 0; }
    .pm-item { border: 1px solid #374151; border-radius: 6px; padding: 8px; background: #0a0f20; font-size: 12px; margin-bottom: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
  </style>
